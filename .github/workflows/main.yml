name: Build tvOS IPA (Unsigned)

on:
  push:
    paths:
      - 'TV/**'
      - '.github/workflows/build-tvos.yml'
  pull_request:
    paths:
      - 'TV/**'
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    name: Build Unsigned tvOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current directory structure (for debugging)
        run: find . -maxdepth 3 -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Build Archive (with code signing disabled)
        run: |
          cd TV
          xcodebuild archive \
            -project *.xcodeproj \
            -scheme * \
            -destination 'generic/platform=tvOS' \
            -archivePath ./build/tvOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
        shell: bash

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -r TV/build/tvOS.xcarchive/Products/Applications/*.app Payload/
          zip -qr TV.ipa Payload/
        shell: bash

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvos-unsigned-ipa
          path: TV.ipa
