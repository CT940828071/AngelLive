name: Build AngelLive tvOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build tvOS IPA
    runs-on: macos-15  # 使用 macOS 15 运行器，支持更高版本 Xcode
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'  # 尝试 16.2，看是否支持 Swift 6.1

      # 检查 Swift 版本
      - name: Check Swift Version
        run: |
          swift --version
          xcodebuild -version

      - name: Install CocoaPods (if needed)
        run: |
          if [ -f "Podfile" ]; then
            sudo gem install cocoapods
            pod install --repo-update
          fi

      - name: Resolve SPM Dependencies
        run: |
          # 尝试使用 swift package resolve 更新依赖
          if [ -f "Package.resolved" ]; then
            rm Package.resolved
          fi
          xcodebuild -resolvePackageDependencies -workspace AngelLive.xcworkspace -scheme AngelLive

      - name: Build tvOS Archive
        run: |
          xcodebuild archive \
            -workspace AngelLive.xcworkspace \
            -scheme AngelLive \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -archivePath build/AngelLive.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=6.0  # 强制使用 Swift 6.0

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/AngelLive.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r ../AngelLive-tvOS-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngelLive-tvOS-unsigned
          path: AngelLive-tvOS-unsigned.ipa
          retention-days: 30

      - name: Create Nightly Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "nightly" && gh release delete "nightly" -y --cleanup-tag 2>/dev/null || true
          gh release create "nightly" AngelLive-tvOS-unsigned.ipa -t "Nightly Build" -n "AngelLive tvOS 自动构建" --prerelease
