name: Build AngelLive tvOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build tvOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Install CocoaPods (if needed)
        run: |
          if [ -f "Podfile" ]; then
            sudo gem install cocoapods
            pod install --repo-update
          fi

      - name: Resolve SPM Dependencies
        run: |
          if [ -f "AngelLive.xcworkspace" ]; then
            xcodebuild -resolvePackageDependencies -workspace AngelLive.xcworkspace -scheme AngelLive
          fi

      - name: Build tvOS Archive
        run: |
          WORKSPACE_ARG="-workspace AngelLive.xcworkspace"
          
          xcodebuild archive \
            $WORKSPACE_ARG \
            -scheme AngelLive \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -archivePath build/AngelLive.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/AngelLive.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r ../AngelLive-tvOS-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngelLive-tvOS-unsigned
          path: AngelLive-tvOS-unsigned.ipa
          retention-days: 30

      - name: Create Nightly Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "nightly" && gh release delete "nightly" -y --cleanup-tag 2>/dev/null || true
          
          gh release create "nightly" \
            AngelLive-tvOS-unsigned.ipa \
            -t "Nightly Build" \
            -n "AngelLive tvOS 自动构建，使用 atvloadly 安装" \
            --prerelease
