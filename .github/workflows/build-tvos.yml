name: Build tvOS IPA (Unsigned)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode Version
      run: xcodebuild -version

    - name: Install Dependencies
      run: |
        # 如果有 CocoaPods 依赖，取消下面注释
        # pod install || true
        
        # 如果有 Swift Package Manager 依赖，Xcode 会自动处理

    - name: Build tvOS Archive (Unsigned)
      run: |
        # 清理之前的构建
        rm -rf build/
        
        # 构建 tvOS 版本 (Release 模式，不签名)
        xcodebuild archive \
          -workspace AngelLive.xcworkspace \
          -scheme AngelLiveTVOS \
          -destination "generic/platform=tvOS" \
          -archivePath "build/AngelLive.xcarchive" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          ONLY_ACTIVE_ARCH=NO \
          ARCHS=arm64 \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          2>&1

    - name: Create Payload Directory
      run: |
        mkdir -p build/Payload
        cp -R build/AngelLive.xcarchive/Products/Applications/*.app build/Payload/

    - name: Package IPA
      run: |
        cd build
        zip -r AngelLive-tvOS-unsigned.ipa Payload
        cd ..
        
        # 显示 IPA 信息
        ls -lh build/AngelLive-tvOS-unsigned.ipa

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AngelLive-tvOS-unsigned
        path: build/AngelLive-tvOS-unsigned.ipa
        retention-days: 30

    - name: Upload to Release (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/AngelLive-tvOS-unsigned.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
