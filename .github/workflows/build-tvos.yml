name: Build tvOS IPA (Unsigned)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout AngelLive
      uses: actions/checkout@v4
      with:
        path: Git_Mini/AngelLive

    - name: Checkout LiveParse Dependency
      uses: actions/checkout@v4
      with:
        repository: pcccccc/LiveParse
        path: Git_Mini/LiveParse

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Build Environment
      run: |
        echo "Current directory: $(pwd)"
        ls -la
        echo "Git_Mini contents:"
        ls -la Git_Mini/
        echo "AngelLive contents:"
        ls -la Git_Mini/AngelLive/
        echo "LiveParse contents:"
        ls -la Git_Mini/LiveParse/

    - name: Build tvOS Archive (Unsigned)
      run: |
        cd Git_Mini/AngelLive
        
        # 清理可能存在的错误缓存
        rm -rf .build/
        rm -rf ~/Library/Developer/Xcode/DerivedData/
        
        # 构建 tvOS 版本 (Release 模式，不签名)
        xcodebuild archive \
          -workspace AngelLive.xcworkspace \
          -scheme AngelLiveTVOS \
          -destination "generic/platform=tvOS" \
          -archivePath "build/AngelLive.xcarchive" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          ONLY_ACTIVE_ARCH=NO \
          ARCHS=arm64 \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          2>&1

    - name: Create Payload Directory
      run: |
        cd Git_Mini/AngelLive
        mkdir -p build/Payload
        cp -R build/AngelLive.xcarchive/Products/Applications/*.app build/Payload/

    - name: Package IPA
      run: |
        cd Git_Mini/AngelLive/build
        zip -r ../AngelLive-tvOS-unsigned.ipa Payload
        cd ../..
        
        # 显示 IPA 信息
        ls -lh Git_Mini/AngelLive/AngelLive-tvOS-unsigned.ipa

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AngelLive-tvOS-unsigned
        path: Git_Mini/AngelLive/AngelLive-tvOS-unsigned.ipa
        retention-days: 30

    - name: Upload to Release (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: Git_Mini/AngelLive/AngelLive-tvOS-unsigned.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
